<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Metabee - Medabots</title>
</head>
<body>
    <div class="cadera">
        <div class="frente">
            <div class="frente__izq"></div>
            <div class="frente__der"></div>
            <div class="frente__sup"></div>
        </div>
        <div class="frente__detalles">
            <div class="frente__circulo"></div>
            <div class="frente__circulo frente__circulo--segundo"></div>
            <div class="frente__barra"></div>
            <div class="frente__barra frente__barra--segunda"></div>
        </div>
        <div class="lateral">
            <div class="lateral__inf"></div>
        </div>
        <div class="lateral lateral--segundo">
            <div class="lateral__inf"></div>
        </div>
        <div class="detras"></div>
        <div class="pierna">
            <div class="pierna__sup"></div>
            <div class="pierna__inf">
                <div class="inf__left"></div>
                <div class="inf__right"></div>
                <div class="pie">
                    <div class="pie_a"></div>
                    <div class="pie_b"></div>
                    <div class="pie_apoyo"></div>
                </div>
            </div>
        </div>
    </div>
    <div class="base"></div>
</body>
</html>
